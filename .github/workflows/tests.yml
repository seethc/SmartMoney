name: SmartMoney checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: bash -n deploy/install-rpi.sh && sh -n start.sh
      - run: node --check frontend/app.js && node --check frontend/screenshots.js
      - run: python tools/package_pi.py
