<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#234e42"><meta name="description" content="Personal finance dashboard.">
  <title>SmartMoney</title>
  <link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="#overview"><img class="brand-mark" src="/icon.svg" alt="">SmartMoney</a>

  <nav aria-label="Main navigation">
    <button data-view="overview" class="active"><span>◫</span>Overview</button>
    <button data-view="accounts"><span>▤</span>Accounts</button>
    <button data-view="spending"><span>◷</span>Spending</button>
    <button data-view="bills"><span>▦</span>Bills</button>
    <button data-view="cashflow"><span>↗</span>Cash flow</button>
    <button data-view="plan"><span>⇄</span>Transfer plan <b id="plan-count">0</b></button>
    <button data-view="transactions"><span>≡</span>Transactions</button>
    <button data-action="screenshots"><span>⌁</span>Snoop screenshots</button>
    <button data-view="data" class="mobile-data"><span>⚙</span>Settings</button>
  </nav>
  <div class="sidebar-bottom">
    <button data-view="data" class="data-link"><span>⚙</span>Data & settings</button>

  </div>
</aside>
<div class="app-shell">
  <header class="topbar"><span class="breadcrumb">My workspace <span>/</span> <strong id="breadcrumb">Overview</strong></span><div class="top-controls"><span class="badge read-only">◉ No payment access</span><button id="install" class="quiet">Install app ↗</button><select id="dataset" aria-label="Workspace"><option value="demo">Demo workspace</option><option value="personal">My real data</option></select></div></header>
  <main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
  <footer><span>SmartMoney</span><span>Stored locally · GBP · No payment access</span></footer>
</div>
<dialog id="dialog"><div id="dialog-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
